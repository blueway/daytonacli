name: verify-ubuntu-2404-baseline

# Temporary verification workflow. Builds the same commit that produced the
# failing static release asset, but on ubuntu-24.04, then checks the ISA and
# runs the result under QEMU's Sandy Bridge CPU model.

on:
  push:
    branches: [verify/ubuntu2404-baseline]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Host toolchain
        run: |
          set -x
          gcc --version | head -1
          ldd --version | head -1
          cat /etc/os-release | head -3

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools perl make curl qemu-user

      - name: Inspect musl libc.a ISA baseline
        run: |
          set -eux
          libc="$(musl-gcc -print-file-name=libc.a)"
          echo "libc.a = $libc"
          echo "musl version: $(strings "$libc" | grep -m1 '^1\.2\.')"
          echo "x86-64-v3 insn count in libc.a:"
          objdump -d "$libc" | grep -cE '\b(andn|bzhi|shlx|shrx|sarx|vpermd|vpbroadcastd|vpternlogd|vperm2i128)\b' || true

      - name: Show toolchain
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Build static release
        run: ./scripts/build-linux-static.sh dist/daytona-linux-x86_64

      - name: Inspect produced binary
        run: |
          set -eux
          file dist/daytona-linux-x86_64
          echo "x86-64-v3 insn count in binary:"
          objdump -d dist/daytona-linux-x86_64 | grep -cE '\b(andn|bzhi|shlx|shrx|sarx|vpermd|vpbroadcastd|vpternlogd|vperm2i128)\b' || true
          echo "--- __copy_tls ---"
          objdump -d --disassemble=__copy_tls dist/daytona-linux-x86_64 | head -30

      - name: QEMU CPU models
        run: qemu-x86_64 -cpu help | grep -iE 'sandy|haswell|qemu64' || true

      - name: Run under Sandy Bridge CPU model
        run: |
          set -eux
          qemu-x86_64 -cpu SandyBridge ./dist/daytona-linux-x86_64 version
          qemu-x86_64 -cpu SandyBridge ./dist/daytona-linux-x86_64 help >/dev/null
          echo "SANDYBRIDGE-RUN-OK"
