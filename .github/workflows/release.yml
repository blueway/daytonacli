name: Release

# Tagging is the trigger: `git tag v0.1.1 && git push origin v0.1.1`.
# `workflow_dispatch` re-cuts a release without moving a tag.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.1 (defaults to the ref name)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # One native build per target. MoonBit's native backend goes through the
  # system C compiler, so each target is built on its own runner rather than
  # cross-compiled.
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # linux-x86_64 publishes its asset directly; the other targets still use
    # the artifact store below.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are linked fully statically against musl so they
          # run on any distribution regardless of its glibc version. A glibc
          # build would bake in the runner's symbol versions and refuse to
          # start on older systems ("GLIBC_2.38 not found").
          #
          # A static binary has no dynamic loader, so OpenSSL (which the HTTPS
          # client loads with dlopen) is built against musl and linked in by
          # scripts/build-linux-static.sh; the build fails rather than ship a
          # binary that cannot talk to the API.
          - runner: ubuntu-24.04
            target: linux-x86_64
            musl: true
          # GitHub's arm64 Linux runners are only available to public
          # repositories. Remove this entry if that is a problem.
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            musl: true
          - runner: macos-15
            target: darwin-aarch64
            musl: false
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      # musl-tools provides musl-gcc; perl, make and curl are what the OpenSSL
      # build in scripts/build-linux-static.sh needs.
      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools perl make curl

      # OpenSSL is the slow part of a static Linux build, and it rarely
      # changes: reuse it across releases until the build script does.
      - name: Cache the OpenSSL build
        if: matrix.musl
        uses: actions/cache@v4
        with:
          path: .cache/openssl-musl
          key: openssl-musl-${{ matrix.target }}-${{ hashFiles('scripts/build-linux-static.sh') }}

      # A fresh runner has an empty registry index, so dependencies
      # (moonbitlang/x, moonbitlang/async, ...) cannot be resolved until the
      # index is fetched.
      - name: Update registry index
        run: moon update

      - name: Build (static, release)
        if: matrix.musl
        run: ./scripts/build-linux-static.sh "dist/daytona-${{ matrix.target }}"

      - name: Build (release)
        if: ${{ !matrix.musl }}
        run: |
          moon build --target native --release
          mkdir -p dist
          cp _build/native/release/build/cmd/daytona/daytona.exe "dist/daytona-${{ matrix.target }}"
          chmod 755 "dist/daytona-${{ matrix.target }}"

      # Only two assets per target: the binary and its checksum. Both the
      # npm launcher and install.sh fetch the bare asset and set the mode
      # themselves, so an archive would be a third thing to keep in sync and
      # nothing would read it. GitHub already offers "Source code (tar.gz)"
      # for anyone who wants an archive of the tag.
      - name: Stage assets
        run: |
          set -eu
          asset="daytona-${{ matrix.target }}"
          file "dist/$asset" || true
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256" 2>/dev/null \
            || sha256sum "$asset" > "$asset.sha256")
          ls -l dist

      - name: Smoke test
        run: |
          set -eu
          "./dist/daytona-${{ matrix.target }}" version
          "./dist/daytona-${{ matrix.target }}" help >/dev/null

      # A v3 build traps in musl's __copy_tls with SIGILL before main on
      # pre-Haswell CPUs. Require a clean start under a Sandy Bridge model.
      - name: Smoke test (Sandy Bridge CPU model)
        if: matrix.target == 'linux-x86_64'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          qemu-x86_64 -cpu SandyBridge "./dist/daytona-${{ matrix.target }}" version
          qemu-x86_64 -cpu SandyBridge "./dist/daytona-${{ matrix.target }}" help >/dev/null

      - name: Resolve release tag
        id: tag
        if: matrix.target == 'linux-x86_64'
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' moon.mod)"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # No upload-artifact hop for linux-x86_64: publish the asset straight to
      # the release. This also means a failure in another target cannot block
      # the x86_64 asset.
      - name: Publish linux-x86_64 to the release
        if: matrix.target == 'linux-x86_64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/daytona-${{ matrix.target }}
            dist/daytona-${{ matrix.target }}.sha256

      - uses: actions/upload-artifact@v4
        if: matrix.target != 'linux-x86_64'
        with:
          name: daytona-${{ matrix.target }}
          path: |
            dist/daytona-${{ matrix.target }}
            dist/daytona-${{ matrix.target }}.sha256
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      # The release tag is the version users see, so refuse to publish a tag
      # whose binaries would report something else. moon.mod is the version
      # checked here; npmjs/package.json is checked by the npm job below.
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' moon.mod)"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          HAVE="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' moon.mod)"
          if [ "$TAG" != "v$HAVE" ]; then
            echo "::error::tag $TAG does not match moon.mod version $HAVE"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*

  # The npm package is a launcher, not a bundle: it downloads the matching
  # release asset on first run. Publishing after the release job guarantees the
  # asset exists before the first user pulls it.
  npm:
    name: publish @kupas/daytona
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check the package version matches the release
        working-directory: npmjs
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -eu
          WANT="${RELEASE_TAG#v}"
          HAVE="$(node -p "require('./package.json').version")"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::npmjs/package.json is $HAVE but the release tag is $WANT"
            exit 1
          fi

      - name: Publish
        working-directory: npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured; skipping the npm publish."
            exit 0
          fi
          npm publish --access public --provenance
